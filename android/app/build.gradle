plugins { id 'com.android.application' }

// GitHub release tags are android-<run number>; the APK uses the matching
// numeric versionCode so the app can compare installed vs latest versions.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger()
def releaseKeyFile = System.getenv('MELODY_KEYSTORE_FILE')
def releaseKeyPassword = System.getenv('MELODY_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MELODY_KEY_ALIAS')
def releaseKeyAliasPassword = System.getenv('MELODY_KEY_PASSWORD')
def hasReleaseSigning = releaseKeyFile && releaseKeyPassword && releaseKeyAlias && releaseKeyAliasPassword

android {
    namespace 'my.melodytrail.game'
    compileSdk 35

    defaultConfig {
        applicationId 'my.melodytrail.game'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeyFile)
                storePassword releaseKeyPassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyAliasPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
