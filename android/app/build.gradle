plugins { id 'com.android.application' }

android {
    namespace 'my.melodytrail.game'
    compileSdk 35

    defaultConfig {
        applicationId 'my.melodytrail.game'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
