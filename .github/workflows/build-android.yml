name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check game JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.lastIndexOf('<script>');
          const end = html.lastIndexOf('</script>');
          if (start < 0 || end <= start) throw new Error('No game script in index.html');
          new Function(html.slice(start + '<script>'.length, end));
          console.log('Game JavaScript syntax OK');
          NODE
      - name: Bundle current game
        run: cp index.html android/app/src/main/assets/index.html
      - name: Compile and lint Android app
        run: gradle -p android assembleDebug lintDebug --no-daemon
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Melody_Trail.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Melody_Trail
          path: Melody_Trail.apk
          if-no-files-found: error
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" Melody_Trail.apk \
            --target "$GITHUB_SHA" \
            --title "Melody Trail Android build ${{ github.run_number }}" \
            --notes "Offline Android prototype built from the current game. Debug-signed APK; a later build may require uninstalling the previous version." \
            --latest
